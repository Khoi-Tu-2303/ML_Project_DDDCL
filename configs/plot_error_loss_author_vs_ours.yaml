# So sánh Fig. 3: hàng trên = code tác giả chạy lại (history['loss'] của Keras, giống paper),
# hàng dưới = code nhóm (trace.jsonl). Chạy:
#   python tools/plot_error_loss.py configs/plot_error_loss_author_vs_ours.yaml
runs_dir: outputs/runs_final_class_blocks
author_dir: outputs/author_rerun
output: outputs/figures/fig3_author_vs_ours_class_block.png
metric: train_loss
ylabel: Loss
xlabel: Epoch
ncols: 2
figsize: [15, 11]
dpi: 150
linewidth: 1.5
inset: {enabled: true, xlim: [25, 200], ylim: null, rect: [0.33, 0.25, 0.62, 0.52], connectors: [2, 4]}

_clean1: &clean1
  - {id: self_paced,      label: Self-Paced Learning,       color: "#1f77b4", linestyle: dashed}
  - {id: sp_ddcl_density, label: Self-Paced DDCL - Density, color: "#ff7f0e", linestyle: solid}
  - {id: sp_ddcl_point,   label: Self-Paced DDCL - Point,   color: "#2ca02c", linestyle: solid}
_banknote: &banknote
  - {id: ddcl_density,  label: Curriculum Learning - Density, color: "#1f77b4", linestyle: solid}
  - {id: ddcl_point,    label: Curriculum Learning - Point,   color: "#ff7f0e", linestyle: solid}
  - {id: no_curriculum, label: No Curriculum,                 color: "#2ca02c", linestyle: dashed}

panels:
  - {dataset: clean1,   source: author, title: "Clean1 — code tác giả chạy lại",   strategies: *clean1}
  - {dataset: banknote, source: author, title: "Banknote — code tác giả chạy lại", strategies: *banknote}
  - {dataset: clean1,   source: ours,   title: "Clean1 — code nhóm",                strategies: *clean1}
  - {dataset: banknote, source: ours,   title: "Banknote — code nhóm",              strategies: *banknote}
